[package]
name = "jay-h"
version = "0.1.1"
description = "Jay-H — the hub of the Jay line"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
# Smaller, leaner binaries (same as Jay-C).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
